# ==========================================
# GLOBAL SETTINGS
# ==========================================
router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  enable_prompt_caching: true
  drop_params: true
  modify_params: true
  additional_drop_params:
    - "tools[*].input_examples"
    - "tools[*].defer_loading"
    - "tools[*].strict"

general_settings:
  set_verbose: false

