# ==========================================
# GLOBAL SETTINGS
# ==========================================
router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
  modify_params: true
  drop_headers: ["anthropic-beta"]
  additional_drop_params:
    - "tools[*].input_examples"
    - "tools[*].cache_control"
    - "tools[*].defer_loading"
    - "tools[*].strict"

general_settings:
  set_verbose: true
