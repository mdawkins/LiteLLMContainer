# Infrastructure-only configuration. Broker routes are reconciled live from
# broker-registry.json into PostgreSQL by brokerctl.py.
model_list: []

litellm_settings:
  enable_prompt_caching: true
  drop_params: true
  modify_params: true
  additional_drop_params:
    - "tools[*].input_examples"
    - "tools[*].defer_loading"
    - "tools[*].strict"

general_settings:
  store_model_in_db: true
  set_verbose: false
